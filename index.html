<script>
// ========== 路徑設定區 - 你只要改這裡 ==========
// index 在外面，圖在 assets/dogs/ ，GitHub Pages 用這個最穩
const IMAGE_PATHS = {
  // 狗狗 5隻 - 你的檔是大寫 .PNG
  "吉娃娃": "assets/dogs/IMG_0875.PNG",
  "博美":   "assets/dogs/IMG_0881.PNG",
  "貴賓":   "assets/dogs/IMG_0879.PNG",
  "柯基":   "assets/dogs/IMG_0880.PNG",
  "米克斯": "assets/dogs/IMG_0876.PNG",
  "chihuahua": "assets/dogs/IMG_0875.PNG",
  "shiba": "assets/dogs/IMG_0881.PNG",
  "poodle": "assets/dogs/IMG_0879.PNG",
  "corgi": "assets/dogs/IMG_0880.PNG",
  "mix": "assets/dogs/IMG_0876.PNG",

  // 配件 8個
  "聖誕帽": "assets/accessories/santa_hat.png",
  "鹿角": "assets/accessories/reindeer.png",
  "圍巾": "assets/accessories/scarf.png",
  "蝴蝶結": "assets/accessories/bow.png",
  "鈴鐺": "assets/accessories/bell.png",
  "雪花": "assets/accessories/snow.png",
  "禮物": "assets/accessories/gift.png",
  "聖誕襪": "assets/accessories/sock.png",

  // 背景
  "奶油白": "assets/backgrounds/cream.png",
  "森林綠": "assets/backgrounds/forest.png",
  "格紋紅": "assets/backgrounds/plaid.png",
  "午夜藍": "assets/backgrounds/midnight.png",
};

// ========== 自動替換邏輯 - 不用改 ==========
(function(){
  function replaceAll(){
    document.querySelectorAll('img').forEach(img=>{
      const alt = (img.alt||'') + (img.src||'');
      const srcAttr = img.getAttribute('src')||'';
      // 如果是 IMAGE_PLACEHOLDER 或路徑錯的，就替換
      if(srcAttr.includes('IMAGE_PLACEHOLDER') || img.naturalWidth===0){
        for(const key in IMAGE_PATHS){
          if(alt.includes(key)){
            img.src = IMAGE_PATHS[key];
            break;
          }
        }
      }
      // 就算已經有 src，也檢查 alt 關鍵字，強制覆蓋成你設定的路徑
      for(const key in IMAGE_PATHS){
        if(alt.includes(key) && !img.src.includes(IMAGE_PATHS[key])){
          // 如果 alt 有對到，就用你設定的路徑
          if(img.src.includes('assets/') || srcAttr.includes('IMAGE_PLACEHOLDER')){
             img.src = IMAGE_PATHS[key];
          }
        }
      }
    });
  }
  // React 畫完再跑
  let count=0;
  const timer=setInterval(()=>{ replaceAll(); count++; if(count>20) clearInterval(timer); }, 500);
  // 監聽新加入的圖
  const obs=new MutationObserver(replaceAll);
  obs.observe(document.body,{childList:true, subtree:true});
  window.replaceAllImages = replaceAll;
})();
</script>
