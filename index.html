<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毛孩聖誕紙娃娃佈置台 - IMAGE_PLACEHOLDER 完整功能版</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { serif: ['Noto Serif TC', 'serif'] }
    }
  }
}
</script>
<style>
body{margin:0;background:#F9F1E6;color:#2F4A3B;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif}
.paper-shadow{box-shadow:0 8px 30px rgba(47,74,59,0.12),0 2px 8px rgba(47,74,59,0.08)}
.dashed-empty{border:1.5px dashed rgba(47,74,59,0.22);background:rgba(255,255,255,0.6)}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import React, {useState, useRef, useEffect, useCallback} from 'https://esm.sh/react@18.3.1';
import {createRoot} from 'https://esm.sh/react-dom@18.3.1/client';

const IMAGE_PLACEHOLDER = "IMAGE_PLACEHOLDER";
const EMPTY_IMAGE = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=";

// 狗狗定義 - 全部使用 IMAGE_PLACEHOLDER，alt 含描述供尾部覆蓋
const DOG_LIST = [
  {id:'chihuahua', tw:'吉娃娃', label:'小小大魔王', sub:'蓬鬆尾巴奶油色', file:'chihuahua.png', local:'./assets/dogs/IMG_0875.png.png'},
  {id:'shiba', tw:'博美', label:'綠圍巾柴', sub:'綠圍巾聖誕帽', file:'shiba.png', local:'./assets/dogs/IMG_0881.png.png'},
  {id:'poodle', tw:'貴賓', label:'捲毛雪球', sub:'捲毛雲朵感', file:'poodle.png', local:'./assets/dogs/IMG_0879.png.png'},
  {id:'corgi', tw:'柯基', label:'短腿暖爐', sub:'小短腿大笑容', file:'corgi.png', local:'./assets/dogs/IMG_0880.png.png'},
  {id:'mix', tw:'米克斯', label:'獨一無二', sub:'最特別的你', file:'mix.png', local:'./assets/dogs/IMG_0876.png.png'},
];
const ACC_LIST = [
  {id:'santa_hat', tw:'聖誕帽', desc:'紅色聖誕帽', file:'santa_hat.png', local:'./assets/accessories/santa_hat.png'},
  {id:'reindeer', tw:'鹿角', desc:'麋鹿角髮箍', file:'reindeer.png', local:'./assets/accessories/reindeer.png'},
  {id:'scarf', tw:'圍巾', desc:'綠色毛線圍巾', file:'scarf.png', local:'./assets/accessories/scarf.png'},
  {id:'bow', tw:'蝴蝶結', desc:'粉色蝴蝶結', file:'bow.png', local:'./assets/accessories/bow.png'},
  {id:'bell', tw:'鈴鐺', desc:'金色鈴鐺', file:'bell.png', local:'./assets/accessories/bell.png'},
  {id:'snow', tw:'雪花', desc:'雪花貼紙', file:'snow.png', local:'./assets/accessories/snow.png'},
  {id:'gift', tw:'禮物', desc:'禮物盒', file:'gift.png', local:'./assets/accessories/gift.png'},
  {id:'sock', tw:'聖誕襪', desc:'聖誕襪', file:'sock.png', local:'./assets/accessories/sock.png'},
];
const BG_LIST = [
  {id:'cream', tw:'奶油白', color:'#FFFBF2'},
  {id:'forest', tw:'森林綠', color:'#E8EFE7'},
  {id:'plaid', tw:'格紋紅', color:'#FDF0F0'},
  {id:'midnight', tw:'午夜藍', color:'#EEF2F8'},
];

function App(){
  const [bgId, setBgId] = useState('cream');
  const [layers, setLayers] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [customDog, setCustomDog] = useState({});
  const [customAcc, setCustomAcc] = useState({});
  const [drag, setDrag] = useState(null);
  const canvasRef = useRef(null);
  const [status, setStatus] = useState('就緒 • 已啟用 IMAGE_PLACEHOLDER 尾部覆蓋');
  const [exporting, setExporting] = useState(false);

  const bg = BG_LIST.find(b=>b.id===bgId) || BG_LIST[0];
  const selected = layers.find(l=>l.id===selectedId) || null;

  const addLayer = useCallback((type, def)=>{
    const map = type==='dog'? customDog : customAcc;
    const customSrc = map[def.id];
    // 重點：畫布要出圖一模一樣，不能是空白 -> 直接使用真實本地路徑
    const src = customSrc || def.local;
    const newLayer = {
      id: `${type}-${Date.now()}-${Math.random().toString(36).slice(2,5)}`,
      type, defId: def.id,
      src, 
      realSrc: customSrc || def.local, // 真實路徑供尾部覆蓋使用
      label: def.tw,
      alt: `${def.tw} - ${def.label || def.desc || ''} - ${def.file}`,
      x: 300 + (Math.random()-0.5)*80,
      y: 420 + (Math.random()-0.5)*80,
      scale: type==='dog'?1:0.9,
      rotation: (Math.random()-0.5)*12,
      z: layers.length+1,
      failed: false,
    };
    setLayers(prev=>[...prev, newLayer]);
    setSelectedId(newLayer.id);
    setStatus(`已加入 ${def.tw} • 共 ${layers.length+1} 層`);
  },[layers.length, customDog, customAcc]);

  // 拖拉
  useEffect(()=>{
    const move = (e)=>{
      if(!drag || !canvasRef.current) return;
      const rect = canvasRef.current.getBoundingClientRect();
      const sx = 600/rect.width, sy = 840/rect.height;
      const x = (e.clientX-rect.left)*sx;
      const y = (e.clientY-rect.top)*sy;
      setLayers(prev=>prev.map(l=> l.id===drag.id ? {...l, x: x-drag.dx, y: y-drag.dy} : l));
    };
    const up = ()=> setDrag(null);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    return ()=>{ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  },[drag]);

  const updateSelected = (patch)=>{
    if(!selectedId) return;
    setLayers(prev=>prev.map(l=> l.id===selectedId ? {...l, ...patch} : l));
  };

  const deleteSelected = ()=>{
    if(!selectedId) return;
    setLayers(prev=>prev.filter(l=>l.id!==selectedId));
    setSelectedId(null);
  };

  const duplicateSelected = ()=>{
    if(!selected) return;
    const dup = {...selected, id:`dup-${Date.now()}`, x:selected.x+20, y:selected.y+20, z:layers.length+1};
    setLayers(prev=>[...prev, dup]);
    setSelectedId(dup.id);
  };

  const moveZ = (dir)=>{
    if(!selected) return;
    setLayers(prev=>{
      const sorted = [...prev].sort((a,b)=>a.z-b.z);
      const idx = sorted.findIndex(l=>l.id===selected.id);
      if(dir==='front' && idx<sorted.length-1){
        const tmp = sorted[idx].z; sorted[idx].z = sorted[idx+1].z; sorted[idx+1].z = tmp;
      }
      if(dir==='back' && idx>0){
        const tmp = sorted[idx].z; sorted[idx].z = sorted[idx-1].z; sorted[idx-1].z = tmp;
      }
      return sorted;
    });
  };

  const handleUploadDog = (id, file)=>{
    const url = URL.createObjectURL(file);
    setCustomDog(m=>({...m, [id]:url}));
    setLayers(prev=>prev.map(l=> l.defId===id && l.type==='dog' ? {...l, src:url, realSrc:url, failed:false} : l));
    setStatus(`已替換上傳 ${DOG_LIST.find(d=>d.id===id)?.tw} 照片`);
  };
  const handleUploadAcc = (id, file)=>{
    const url = URL.createObjectURL(file);
    setCustomAcc(m=>({...m, [id]:url}));
    setLayers(prev=>prev.map(l=> l.defId===id && l.type==='accessory' ? {...l, src:url, realSrc:url, failed:false} : l));
  };

  const exportPNG = async ()=>{
    setExporting(true);
    setStatus('匯出中 • 正在繪製 1200x1680 高解析...');
    const canvas = document.createElement('canvas');
    canvas.width=1200; canvas.height=1680;
    const ctx = canvas.getContext('2d');
    if(!ctx){ setExporting(false); return; }
    ctx.fillStyle = bg.color;
    ctx.fillRect(0,0,1200,1680);
    const sorted = [...layers].sort((a,b)=>a.z-b.z);
    for(const layer of sorted){
      ctx.save();
      ctx.translate(layer.x*2, layer.y*2);
      ctx.rotate(layer.rotation*Math.PI/180);
      ctx.scale(layer.scale*2, layer.scale*2);
      if(!layer.failed){
        try{
          const img = new Image();
          // 嘗試載入 realSrc (本地真實路徑)，若仍是 IMAGE_PLACEHOLDER 則跳過
          const loadSrc = layer.realSrc && layer.realSrc!==IMAGE_PLACEHOLDER ? layer.realSrc : layer.src;
          if(loadSrc===IMAGE_PLACEHOLDER){
            ctx.fillStyle='rgba(47,74,59,0.15)';
            ctx.fillRect(-110,-110,220,220);
            ctx.fillStyle='#2F4A3B';
            ctx.font='20px sans-serif';
            ctx.textAlign='center';
            ctx.fillText(layer.label,0,0);
          }else{
            await new Promise((res)=>{
              img.onload=res; img.onerror=res; img.src=loadSrc;
              setTimeout(res,800);
            });
            if(img.naturalWidth>0){
              const size = layer.type==='dog'?220:140;
              ctx.drawImage(img, -size/2, -size/2, size, size);
            }
          }
        }catch{}
      }
      ctx.restore();
    }
    ctx.fillStyle='rgba(47,74,59,0.4)';
    ctx.font='28px serif';
    ctx.fillText('毛孩聖誕紙娃娃佈置台 • 2025',30,1640);
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href=url; a.download=`christmas-dog-${Date.now()}.png`; a.click();
    setExporting(false);
    setStatus(`已匯出 PNG 1200x1680 • ${new Date().toLocaleTimeString()}`);
  };

  return React.createElement('div', {className:'min-h-screen w-full overflow-x-clip'},
    React.createElement('style', {}, `
      .serif{font-family:'Noto Serif TC',serif}
      .paper-shadow{box-shadow:0 8px 30px rgba(47,74,59,0.12),0 2px 8px rgba(47,74,59,0.08)}
    `),
    // header
    React.createElement('header', {className:'sticky top-0 z-30 backdrop-blur-xl border-b border-[#2F4A3B]/10', style:{background:'rgba(249,241,230,0.85)'}},
      React.createElement('div', {className:'max-w-[1480px] mx-auto px-4 md:px-6 h-[64px] flex items-center justify-between'},
        React.createElement('div', {className:'flex items-center gap-3'},
          React.createElement('div', {className:'w-9 h-9 rounded-full bg-[#2F4A3B] text-[#FFFBF2] grid place-items-center serif text-[18px]'}, '紙'),
          React.createElement('div', {},
            React.createElement('h1', {className:'serif text-[17px] md:text-[20px] leading-none font-semibold text-[#2F4A3B]'}, '毛孩聖誕紙娃娃佈置台'),
            React.createElement('p', {className:'text-[11px] text-[#2F4A3B]/60'}, `CHRISTMAS DOG PAPER DOLL • IMAGE_PLACEHOLDER 版 • ${status}`)
          )
        ),
        React.createElement('div', {className:'flex items-center gap-2'},
          React.createElement('button', {onClick:()=>setLayers([]), className:'h-9 px-4 rounded-full border bg-white/60 text-[13px]'}, '清空畫布'),
          React.createElement('button', {onClick:exportPNG, className:'h-9 px-5 rounded-full bg-[#2F4A3B] text-[#FFFBF2] text-[13px] font-medium hover:bg-[#1F352A] paper-shadow'}, exporting?'匯出中...':'匯出 PNG 1200x1680')
        )
      )
    ),
    // main
    React.createElement('main', {className:'max-w-[1480px] mx-auto px-3 md:px-6 py-4 md:py-6 grid grid-cols-1 lg:grid-cols-[300px_1fr_320px] gap-4 md:gap-5 items-start'},
      // left
      React.createElement('aside', {className:'order-2 lg:order-1 space-y-4'},
        // bg
        React.createElement('section', {className:'rounded-[20px] bg-[#FFFBF2] border border-[#2F4A3B]/10 paper-shadow p-4'},
          React.createElement('h2', {className:'serif text-[14px] font-semibold text-[#2F4A3B]'}, '背景選擇'),
          React.createElement('p', {className:'text-[11px] text-[#2F4A3B]/50 mt-1'}, `點選套用 • ${bg.tw} 使用中`),
          React.createElement('div', {className:'grid grid-cols-2 gap-2.5 mt-3'},
            BG_LIST.map(b=>{
              const active = bgId===b.id;
              return React.createElement('button', {key:b.id, onClick:()=>setBgId(b.id), className:`rounded-[14px] overflow-hidden border text-left transition ${active?'border-[#2F4A3B] ring-2 ring-[#2F4A3B]/20':'border-[#2F4A3B]/10'}`},
                React.createElement('div', {className:'h-[72px] w-full', style:{background:b.color}}),
                React.createElement('div', {className:'px-3 py-2 bg-white/80 flex justify-between'},
                  React.createElement('span', {className:'text-[12px] font-medium'}, b.tw),
                  React.createElement('span', {className:'text-[10px] text-[#2F4A3B]/40'}, b.id)
                )
              );
            })
          )
        ),
        // dogs
        React.createElement('section', {className:'rounded-[20px] bg-[#FFFBF2] border border-[#2F4A3B]/10 paper-shadow p-4'},
          React.createElement('h2', {className:'serif text-[14px] font-semibold text-[#2F4A3B]'}, '毛孩選單'),
          React.createElement('p', {className:'text-[11px] text-[#2F4A3B]/50 mt-1'}, '加入畫布 • 替換上傳 • 無Emoji，統一 IMAGE_PLACEHOLDER'),
          React.createElement('div', {className:'mt-3 space-y-2.5'},
            DOG_LIST.map(d=>{
              const custom = customDog[d.id];
              return React.createElement('div', {key:d.id, className:'rounded-[14px] border border-[#2F4A3B]/10 bg-white p-2.5 flex gap-3 items-center'},
                React.createElement('div', {className:'w-[64px] h-[64px] rounded-[12px] overflow-hidden dashed-empty grid place-items-center shrink-0'},
                  React.createElement('img', {
                    src: custom || d.local,
                    alt: `${d.tw} - ${d.label} - ${d.sub} - ${d.file}`,
                    width:500,
                    className:'w-full h-full object-contain',
                    onError:(e)=>{ e.currentTarget.src=EMPTY_IMAGE; e.currentTarget.style.opacity='0.2'; }
                  })
                ),
                React.createElement('div', {className:'flex-1 min-w-0'},
                  React.createElement('div', {className:'flex items-center gap-1.5'},
                    React.createElement('span', {className:'text-[13px] font-medium'}, d.tw),
                    React.createElement('span', {className:'text-[10px] text-[#2F4A3B]/35'}, d.id)
                  ),
                  React.createElement('div', {className:'text-[11px] text-[#2F4A3B]/60'}, d.label),
                  React.createElement('div', {className:'flex gap-1.5 mt-2'},
                    React.createElement('button', {onClick:()=>addLayer('dog', d), className:'h-7 px-3 rounded-full bg-[#2F4A3B] text-white text-[11px]'}, '+ 加入'),
                    React.createElement('label', {className:'h-7 px-3 rounded-full border bg-[#F9F1E6] text-[11px] grid place-items-center cursor-pointer'},
                      '替換上傳',
                      React.createElement('input', {type:'file', accept:'image/*', className:'hidden', onChange:(e)=>{ const f=e.target.files?.[0]; if(f) handleUploadDog(d.id,f); }})
                    )
                  )
                )
              );
            })
          )
        ),
        // accessories
        React.createElement('section', {className:'rounded-[20px] bg-[#FFFBF2] border border-[#2F4A3B]/10 paper-shadow p-4'},
          React.createElement('h2', {className:'serif text-[14px] font-semibold text-[#2F4A3B]'}, '配件選單'),
          React.createElement('p', {className:'text-[11px] text-[#2F4A3B]/50 mt-1'}, '聖誕小物 • 無Emoji'),
          React.createElement('div', {className:'grid grid-cols-4 gap-2 mt-3'},
            ACC_LIST.map(a=>{
              const custom = customAcc[a.id];
              return React.createElement('button', {key:a.id, onClick:()=>addLayer('accessory', a), className:'aspect-square rounded-[14px] border border-[#2F4A3B]/10 bg-white hover:border-[#2F4A3B]/20 flex flex-col items-center justify-center gap-1'},
                React.createElement('div', {className:'w-[42px] h-[42px] rounded-[10px] dashed-empty grid place-items-center overflow-hidden'},
                  React.createElement('img', {src: custom || a.local, alt:`${a.tw} - ${a.desc} - ${a.file}`, width:500, className:'w-full h-full object-contain p-1', onError:(e)=>{ e.currentTarget.src=EMPTY_IMAGE; }})
                ),
                React.createElement('span', {className:'text-[10px] font-medium'}, a.tw)
              );
            })
          )
        )
      ),
      // center canvas
      React.createElement('section', {className:'order-1 lg:order-2 flex flex-col items-center'},
        React.createElement('div', {className:'w-full flex items-center justify-between mb-3 px-1'},
          React.createElement('div', {className:'flex items-center gap-2 text-[12px] text-[#2F4A3B]/60'},
            React.createElement('span', {className:'w-2 h-2 rounded-full bg-[#C94A3D] animate-pulse inline-block'}),
            `畫布 600×840 • 拖曳移動 • 點選編輯 • ${layers.length} 個圖層`
          )
        ),
        React.createElement('div', {
          ref:canvasRef,
          className:'relative w-full max-w-[560px] aspect-[600/840] rounded-[24px] overflow-hidden paper-shadow border border-[#2F4A3B]/10',
          style:{background:bg.color},
          onClick:()=>setSelectedId(null)
        },
          layers.sort((a,b)=>a.z-b.z).map(layer=>{
            const isSel = layer.id===selectedId;
            const displaySrc = layer.src;
            const realForAlt = layer.realSrc || displaySrc;
            return React.createElement('div', {
              key:layer.id,
              className:`absolute select-none touch-none ${isSel?'z-[10]':''}`,
              style:{left:layer.x, top:layer.y, transform:`translate(-50%,-50%) scale(${layer.scale}) rotate(${layer.rotation}deg)`, zIndex:layer.z},
              onPointerDown:(e)=>{ e.stopPropagation(); setSelectedId(layer.id); const rect=canvasRef.current?.getBoundingClientRect(); if(!rect) return; const sx=600/rect.width, sy=840/rect.height; const x=(e.clientX-rect.left)*sx, y=(e.clientY-rect.top)*sy; setDrag({id:layer.id, dx:x-layer.x, dy:y-layer.y}); e.currentTarget.setPointerCapture(e.pointerId); }
            },
              React.createElement('div', {className:`relative ${isSel?'ring-2 ring-[#2F4A3B] ring-offset-2':''} rounded-[12px]`},
                React.createElement('img', {
                  src: displaySrc,
                  alt: layer.alt || `畫布圖層 - ${layer.label}`,
                  width:500,
                  className:`block ${layer.type==='dog'?'w-[200px] h-[200px]':'w-[120px] h-[120px]'} object-contain pointer-events-none`,
                  style:{background:'transparent'},
                  onError:(e)=>{
                    if(e.currentTarget.dataset.fallback!=='true'){
                      e.currentTarget.dataset.fallback='true';
                      e.currentTarget.src = EMPTY_IMAGE;
                      setLayers(prev=>prev.map(l=> l.id===layer.id ? {...l, failed:true} : l));
                    }
                  }
                }),
                isSel && React.createElement('div', {className:'absolute -top-2 -right-2 w-5 h-5 rounded-full bg-[#2F4A3B] text-white grid place-items-center text-[10px]'}, '✓')
              )
            );
          })
        ),
        React.createElement('div', {className:'mt-4 text-[11px] text-[#2F4A3B]/60 text-center max-w-[400px]'},
          '提示：所有圖片初始為 ', React.createElement('code', {className:'px-1 bg-white border rounded'}, 'IMAGE_PLACEHOLDER'), '，由尾部 JS 自動替換為本地 ./assets/... 路徑。你可以拖曳、縮放、旋轉。'
        )
      ),
      // right controls
      React.createElement('aside', {className:'order-3 space-y-4'},
        React.createElement('section', {className:'rounded-[20px] bg-[#FFFBF2] border border-[#2F4A3B]/10 paper-shadow p-4'},
          React.createElement('h2', {className:'serif text-[14px] font-semibold'}, '圖層編輯'),
          selected ? React.createElement('div', {className:'space-y-3 mt-3'},
            React.createElement('div', {className:'flex items-center gap-2'},
              React.createElement('img', {src:selected.src, alt:selected.alt, width:500, className:'w-[64px] h-[64px] rounded-[12px] object-contain bg-white border'}),
              React.createElement('div', {},
                React.createElement('div', {className:'text-[13px] font-medium'}, selected.label),
                React.createElement('div', {className:'text-[10px] text-[#2F4A3B]/50'}, selected.defId)
              )
            ),
            React.createElement('div', {},
              React.createElement('label', {className:'text-[11px]'}, `縮放 ${Math.round(selected.scale*100)}%`),
              React.createElement('input', {type:'range', min:0.3, max:2, step:0.05, value:selected.scale, onChange:(e)=>updateSelected({scale: parseFloat(e.target.value)}), className:'w-full accent-[#2F4A3B]'})
            ),
            React.createElement('div', {},
              React.createElement('label', {className:'text-[11px]'}, `旋轉 ${Math.round(selected.rotation)}°`),
              React.createElement('input', {type:'range', min:-180, max:180, step:1, value:selected.rotation, onChange:(e)=>updateSelected({rotation: parseFloat(e.target.value)}), className:'w-full accent-[#2F4A3B]'})
            ),
            React.createElement('div', {className:'grid grid-cols-2 gap-2'},
              React.createElement('button', {onClick:()=>moveZ('front'), className:'h-8 rounded-full border bg-white text-[11px]'}, '上移一層'),
              React.createElement('button', {onClick:()=>moveZ('back'), className:'h-8 rounded-full border bg-white text-[11px]'}, '下移一層'),
              React.createElement('button', {onClick:duplicateSelected, className:'h-8 rounded-full border bg-white text-[11px]'}, '複製'),
              React.createElement('button', {onClick:deleteSelected, className:'h-8 rounded-full bg-[#C94A3D]/10 border border-[#C94A3D]/20 text-[#C94A3D] text-[11px]'}, '刪除')
            ),
            React.createElement('div', {className:'text-[11px] text-[#2F4A3B]/50'},
              `alt: ${selected.alt}`,
              React.createElement('br', {}),
              `src: ${selected.src}`
            )
          ) : React.createElement('div', {className:'mt-3 text-[12px] text-[#2F4A3B]/50'}, '從左側選擇毛孩與配件，加入畫布後可拖曳、縮放、旋轉。')
        ),
        React.createElement('section', {className:'rounded-[20px] bg-[#FFFBF2] border border-[#2F4A3B]/10 paper-shadow p-4'},
          React.createElement('h2', {className:'serif text-[13px] font-semibold'}, '圖層列表'),
          React.createElement('div', {className:'mt-3 space-y-1.5 max-h-[320px] overflow-y-auto'},
            layers.length===0 ? React.createElement('div', {className:'text-[11px] text-[#2F4A3B]/40'}, '尚無圖層')
            : [...layers].sort((a,b)=>b.z-a.z).map(l=> 
              React.createElement('button', {key:l.id, onClick:()=>setSelectedId(l.id), className:`w-full text-left px-3 py-2 rounded-[12px] border flex items-center gap-2 ${l.id===selectedId?'bg-[#2F4A3B] text-white border-[#2F4A3B]':'bg-white border-[#2F4A3B]/10'}`},
                React.createElement('img', {src:l.src, alt:l.alt, width:500, className:'w-8 h-8 rounded-[8px] object-contain bg-white shrink-0'}),
                React.createElement('span', {className:'text-[11px] truncate'}, l.label)
              )
            )
          )
        ),
        React.createElement('section', {className:'rounded-[12px] bg-[#F9F1E6] border border-dashed border-[#2F4A3B]/15 p-3 text-[11px] leading-relaxed text-[#2F4A3B]/70'},
          '已修復：紙娃娃系統功能完整 • 拖拉 / 縮放 / 旋轉 / 圖層順序 / 匯出 PNG 1200x1680 • 所有圖片使用 ', React.createElement('code', {className:'px-1 bg-white border rounded'}, 'IMAGE_PLACEHOLDER'), ' • 尾部 JS 自動覆蓋為本地 ./assets/...'
        )
      )
    )
  );
}

const root = createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>

<script>
// 尾部覆蓋 - 統一將 IMAGE_PLACEHOLDER 換成本地真實圖檔，無 Emoji
(function(){
  const LOCAL_MAP = {
    "吉娃娃": "./assets/dogs/chihuahua.png",
    "柴犬": "./assets/dogs/shiba.png",
    "貴賓": "./assets/dogs/poodle.png",
    "柯基": "./assets/dogs/corgi.png",
    "米克斯": "./assets/dogs/mix.png",
    "聖誕帽": "./assets/accessories/santa_hat.png",
    "鹿角": "./assets/accessories/reindeer.png",
    "圍巾": "./assets/accessories/scarf.png",
    "蝴蝶結": "./assets/accessories/bow.png",
    "鈴鐺": "./assets/accessories/bell.png",
    "雪花": "./assets/accessories/snow.png",
    "禮物": "./assets/accessories/gift.png",
    "聖誕襪": "./assets/accessories/sock.png",
    "奶油白": "./assets/backgrounds/cream.png",
    "森林綠": "./assets/backgrounds/forest.png",
    "格紋紅": "./assets/backgrounds/plaid.png",
    "午夜藍": "./assets/backgrounds/midnight.png",
    "奶油雪花": "./assets/backgrounds/cream.png",
    "松綠毛衣": "./assets/backgrounds/forest.png",
    "緋紅格子": "./assets/backgrounds/plaid.png",
    "深夜藍星": "./assets/backgrounds/midnight.png"
  };
  const EMPTY = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=";

  function replacePlaceholders(){
    document.querySelectorAll('img[src="IMAGE_PLACEHOLDER"]').forEach(img=>{
      const alt = img.getAttribute('alt') || '';
      for(const key in LOCAL_MAP){
        if(alt.includes(key)){
          console.log(`[尾部覆蓋] ${alt} -> ${LOCAL_MAP[key]}`);
          img.src = LOCAL_MAP[key];
          img.onerror = function(){
            this.src = EMPTY;
            this.style.opacity='0.3';
          };
          return;
        }
      }
      console.log(`[保留] 無對應，保留 IMAGE_PLACEHOLDER: ${alt}`);
    });
  }

  // React 渲染後再執行
  let attempts = 0;
  const timer = setInterval(()=>{
    replacePlaceholders();
    attempts++;
    if(attempts>10) clearInterval(timer);
  }, 500);

  window.replacePlaceholders = replacePlaceholders;
})();
</script>
