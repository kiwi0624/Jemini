<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>聖誕狗狗卡片 V26-3 - 可拖動不變形版</title>
<style>
/* ========== 1. 全域 ========== */
:root{--bg-page:#FFF7ED;--panel-w:360px;--radius:18px;--border:#FFEDD5;--text-main:#7c2d12}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 120% at 20% 10%, #FFF7ED 0%, #FFEDD5 18%, #FDE68A 42%, #FDBA74 68%, #F97316 100%);color:var(--text-main);font-family:ui-sans-serif,system-ui,sans-serif;min-height:100vh}
button,input,textarea{font-family:inherit}
img{display:block;max-width:100%}
.header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.header h1{margin:0;font-size:18px;font-weight:800}
.size-switch{display:flex;gap:8px}
.btn{border:1px solid var(--border);background:#fff;padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.btn.active{background:#7c2d12;color:#fff;border-color:#7c2d12}
.btn-danger{background:#fff0f0;border-color:#fecaca}
.btn-small{padding:4px 8px;font-size:11px}
.main{max-width:1400px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){.main{flex-direction:row;align-items:flex-start;gap:20px;padding:20px}.panel{width:var(--panel-w);position:sticky;top:72px;flex-shrink:0}.canvas-area{flex:1;display:flex;justify-content:center}}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;order:2}
@media (min-width:900px){.panel{order:1}}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab-btn{flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer}
.tab-btn.active{background:#FFF7ED;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid-item{aspect-ratio:1;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;position:relative}
.grid-item img{width:100%;height:100%;object-fit:cover}
.grid-item .label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.45);color:#fff;font-size:9px;text-align:center;padding:2px 0}
.upload-box{margin-top:10px;border:1px dashed #fdba74;border-radius:12px;padding:10px;text-align:center}
.upload-box input{width:100%}
.text-controls{display:flex;flex-direction:column;gap:10px}
.text-controls textarea{width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;padding:8px;resize:vertical}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;min-width:54px}
.range{flex:1}
.canvas-area{order:1}
@media (min-width:900px){.canvas-area{order:2}}
.canvas-wrap{width:min(92vw,520px);margin:0 auto;position:relative}
#canvas{width:100%;aspect-ratio:1/1;background:#fff;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 20px 40px rgba(124,45,18,0.15);touch-action:auto;user-select:none}
#canvas-bg{position:absolute;inset:0;pointer-events:none;z-index:0}
#canvas-bg img{width:100%;height:100%;object-fit:cover;pointer-events:none}
#canvas-items{position:absolute;inset:0;z-index:1}
#drag-shield{position:absolute;inset:0;z-index:9;display:none;background:transparent;pointer-events:auto;touch-action:none}
#drag-shield.show{display:block}
.safe-guide{position:absolute;inset:0;border:1px dashed rgba(124,45,18,0.25);pointer-events:none;z-index:5}
.safe-guide.inner{inset:6%}
.item{position:absolute;left:0;top:0;transform-origin:center center;touch-action:none;cursor:grab;user-select:none;will-change:transform,left,top;flex-shrink:0}
.item img{pointer-events:none;user-select:none;-webkit-user-drag:none;display:block;width:auto;height:auto;max-width:none;object-fit:contain;flex-shrink:0;min-width:0;min-height:0}
.item.selected{outline:2px dashed #7c2d12;outline-offset:4px;border-radius:8px}
.handle{position:absolute;width:28px;height:28px;background:#fff;border:1px solid #7c2d12;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;cursor:pointer;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.handle.del{left:-12px;top:-12px;background:#ef4444;color:#fff;border-color:#ef4444}
.handle.rot{right:-12px;top:-12px}
.handle.scale{right:-12px;bottom:-12px;cursor:nwse-resize}
.handle.up{left:-12px;bottom:28px}
.handle.down{left:-12px;bottom:-12px}
.handle.w-left{left:-14px;top:50%;transform:translateY(-50%);cursor:ew-resize;background:#7c2d12;color:#fff;width:18px;height:36px;border-radius:6px;font-size:8px}
.handle.w-right{right:-14px;top:50%;transform:translateY(-50%);cursor:ew-resize;background:#7c2d12;color:#fff;width:18px;height:36px;border-radius:6px;font-size:8px}
body.dragging{overflow:hidden;touch-action:none;user-select:none}
body.dragging #canvas{cursor:grabbing}
/* 文字盒 - 靠邊不變形，自動適應 */
.text-box{white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;line-height:1.4;box-sizing:border-box;display:block;max-width:100%;flex-shrink:0;min-width:80px;transition:width 0.05s linear}
.layer-list{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}
.layer-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:#fff;font-size:12px}
.layer-item.active{border-color:#7c2d12;background:#FFF7ED}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:min(90%,360px)}
</style>
</head>
<body>
<header class="header">
  <h1>聖誕狗狗卡片 V26-3</h1>
  <div class="size-switch">
    <button class="btn active" id="btn-post">IG 貼文 1080x1080</button>
    <button class="btn" id="btn-story">IG 限動 1080x1920</button>
    <button class="btn" id="btn-guide">安全框</button>
  </div>
  <div class="size-switch">
    <button class="btn" id="btn-preview">預覽</button>
    <button class="btn" id="btn-clear">清空</button>
    <select id="export-type" class="btn"><option value="png">PNG</option><option value="jpg">JPG</option></select>
    <button class="btn active" id="btn-export">下載</button>
  </div>
</header>
<main class="main">
  <aside class="panel" id="panel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="dogs">狗狗</button>
      <button class="tab-btn" data-tab="acc">配件</button>
      <button class="tab-btn" data-tab="bg">背景</button>
      <button class="tab-btn" data-tab="text">文字</button>
    </div>
    <div class="tab-panel" id="panel-dogs">
      <div class="grid" id="grid-dogs"></div>
      <div class="upload-box"><div style="font-size:12px;margin-bottom:6px">自訂狗狗 (最多10)</div><input type="file" id="upload-dogs" accept="image/*" multiple><div class="grid" id="custom-dogs" style="margin-top:8px"></div></div>
    </div>
    <div class="tab-panel" id="panel-acc" style="display:none">
      <div class="grid" id="grid-acc"></div>
      <div class="upload-box"><div style="font-size:12px;margin-bottom:6px">自訂配件</div><input type="file" id="upload-acc" accept="image/*" multiple><div class="grid" id="custom-acc" style="margin-top:8px"></div></div>
    </div>
    <div class="tab-panel" id="panel-bg" style="display:none">
      <div class="grid" id="grid-bg" style="grid-template-columns:repeat(2,1fr)"></div>
      <div class="upload-box"><div style="font-size:12px;margin-bottom:6px">自訂背景</div><input type="file" id="upload-bg" accept="image/*" multiple><div class="grid" id="custom-bg" style="margin-top:8px;grid-template-columns:repeat(2,1fr)"></div></div>
    </div>
    <div class="tab-panel" id="panel-text" style="display:none">
      <div class="text-controls">
        <textarea id="text-input" placeholder="輸入祝福文字，例如 Merry Christmas"></textarea>
        <button class="btn active" id="add-text">加入文字</button>
        <div class="row"><button class="btn btn-small" data-align="left">置左</button><button class="btn btn-small active" data-align="center">置中</button><button class="btn btn-small" data-align="right">置右</button></div>
        <div class="row"><label>顏色</label><input type="color" id="text-color" value="#7c2d12"></div>
        <div class="row"><label>大小</label><input type="range" id="text-size" min="20" max="120" value="48" class="range"><span id="text-size-val">48</span></div>
        <div class="row"><label>框寬</label><input type="range" id="text-boxw" min="80" max="600" value="300" class="range"><span id="text-boxw-val">300</span><span style="font-size:10px;color:#888"> 可直接在畫布拉寬</span></div>
        <div class="row"><label>字距</label><input type="range" id="text-space" min="-2" max="12" value="0" class="range"><span id="text-space-val">0</span></div>
        <div class="row"><label>行距</label><input type="range" id="text-lineh" min="0.8" max="2" step="0.1" value="1.4" class="range"><span id="text-lineh-val">1.4</span></div>
      </div>
    </div>
    <div class="layer-list" id="layer-list"><div style="font-size:12px;font-weight:700;margin-bottom:6px">圖層 (可拖動/上下移/刪除)</div><div id="layer-items"></div></div>
  </aside>
  <section class="canvas-area">
    <div class="canvas-wrap" id="canvas-wrap">
      <!-- 畫布、圖層、拖拉使用 Pointer Events + shield 防止點到背景 -->
      <!-- 圖片 touch-action:none 防止網頁移動，背景 pointer-events:none -->
      <div id="canvas">
        <div id="canvas-bg"></div>
        <div id="canvas-items"></div>
        <div id="drag-shield"></div>
        <div class="safe-guide" id="guide-outer" style="display:none"></div>
        <div class="safe-guide inner" id="guide-inner" style="display:none"></div>
      </div>
    </div>
  </section>
</main>
<div class="modal" id="modal-clear"><div class="modal-box"><div style="font-weight:700;margin-bottom:8px">確定清空？</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="cancel-clear">取消</button><button class="btn btn-danger" id="confirm-clear">確定</button></div></div></div>
<div class="modal" id="modal-preview"><div class="modal-box" style="width:min(92%,420px);text-align:center"><div style="font-weight:700;margin-bottom:10px">預覽</div><img id="preview-img" style="width:100%;border-radius:12px;border:1px solid #eee"><div style="margin-top:12px"><button class="btn" id="close-preview">關閉</button></div></div></div>
<script>
/* === 圖片資源管理區 - 方便後續覆蓋替換 === */
const ASSETS = {
  dogs: ["assets/dogs/IMG_0880.PNG","assets/dogs/IMG_0881.PNG","assets/dogs/IMG_0879.PNG","assets/dogs/IMG_0878.PNG","assets/dogs/IMG_0877.PNG","assets/dogs/IMG_0876.PNG","assets/dogs/IMG_0875.PNG"],
  accessories: ["assets/accessories/acc1.png","assets/accessories/acc2.png","assets/accessories/acc3.png","assets/accessories/acc4.png"],
  backgrounds: [{color:"#FFF7ED",img:"assets/backgrounds/bg1.jpg",name:"暖橘"},{color:"#FEF2F2",img:"assets/backgrounds/bg2.jpg",name:"紅色"},{color:"#F0FDF4",img:"assets/backgrounds/bg3.jpg",name:"松林"}]
};
let customDogs=[],customAcc=[],customBg=[];
let currentSize="post";
let currentBg=ASSETS.backgrounds[0];
let layers=[]; let selectedId=null; let layerCounter=0;

function makePlaceholder(type,index,color){
  const c=document.createElement('canvas');c.width=400;c.height=400;const ctx=c.getContext('2d');ctx.fillStyle=color||'#FFEDD5';ctx.fillRect(0,0,400,400);ctx.fillStyle='#7c2d12';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText(type+' '+index,200,200);ctx.font='16px sans-serif';ctx.fillText('圖片未找到',200,240);return c.toDataURL('image/png');
}
function loadImage(src){return new Promise((res,rej)=>{const img=new Image();img.crossOrigin='anonymous';img.onload=()=>res(img);img.onerror=()=>rej();img.src=src;});}

function renderGrids(){
  const dogGrid=document.getElementById('grid-dogs');dogGrid.innerHTML='';ASSETS.dogs.forEach((src,i)=>{const d=document.createElement('div');d.className='grid-item';d.innerHTML=`<img src="${src}" alt="DOG${i+1}" onerror="this.src='${makePlaceholder('DOG',i+1,'#FFE4B5')}'"><div class="label">DOG${i+1}</div>`;d.onclick=()=>addImageLayer('dog',src);dogGrid.appendChild(d);});
  const cd=document.getElementById('custom-dogs');cd.innerHTML='';customDogs.forEach((src,i)=>{const d=document.createElement('div');d.className='grid-item';d.innerHTML=`<img src="${src}"><div class="label">自訂${i+1}</div>`;d.onclick=()=>addImageLayer('dog',src);cd.appendChild(d);});
  const accGrid=document.getElementById('grid-acc');accGrid.innerHTML='';ASSETS.accessories.forEach((src,i)=>{const d=document.createElement('div');d.className='grid-item';d.innerHTML=`<img src="${src}" alt="ACC${i+1}" onerror="this.src='${makePlaceholder('ACC',i+1,'#E0F2FE')}'"><div class="label">ACC${i+1}</div>`;d.onclick=()=>addImageLayer('acc',src);accGrid.appendChild(d);});
  const ca=document.getElementById('custom-acc');ca.innerHTML='';customAcc.forEach((src,i)=>{const d=document.createElement('div');d.className='grid-item';d.innerHTML=`<img src="${src}"><div class="label">自訂${i+1}</div>`;d.onclick=()=>addImageLayer('acc',src);ca.appendChild(d);});
  const bgGrid=document.getElementById('grid-bg');bgGrid.innerHTML='';ASSETS.backgrounds.forEach((bg,i)=>{const d=document.createElement('div');d.className='grid-item';d.style.background=bg.color;d.innerHTML=`<img src="${bg.img}" style="width:100%;height:100%;object-fit:cover;opacity:0.9" onerror="this.style.display='none'"><div class="label">${bg.name}</div>`;d.onclick=()=>setBackground(bg);bgGrid.appendChild(d);});
  const cb=document.getElementById('custom-bg');cb.innerHTML='';customBg.forEach((bg,i)=>{const d=document.createElement('div');d.className='grid-item';d.style.background=bg.color||'#fff';d.innerHTML=`<img src="${bg.img}" style="width:100%;height:100%;object-fit:cover"><div class="label">${bg.name}</div>`;d.onclick=()=>setBackground(bg);cb.appendChild(d);});
}
function setBackground(bg){currentBg=bg;const bgEl=document.getElementById('canvas-bg');bgEl.innerHTML='';bgEl.style.background=bg.color||'#fff';if(bg.img){const img=document.createElement('img');img.src=bg.img;img.onerror=()=>{img.style.display='none'};bgEl.appendChild(img);}}

function addImageLayer(type,src){
  layerCounter++;const id='L'+Date.now()+'_'+layerCounter;const baseW=type==='dog'?220:120;
  layers.push({id,type,src,x:0.5,y:0.5,scale:1,rot:0,baseW,z:layers.length});selectedId=id;renderLayers();renderLayerList();
}
function addTextLayer(){
  const txt=document.getElementById('text-input').value.trim();if(!txt){alert('請先輸入文字');return;}
  layerCounter++;const id='L'+Date.now()+'_'+layerCounter;
  layers.push({id,type:'text',text:txt,x:0.5,y:0.65,scale:1,rot:0,baseW:300,fontSize:parseInt(document.getElementById('text-size').value),color:document.getElementById('text-color').value,align:document.querySelector('[data-align].active')?.dataset.align||'center',boxW:parseInt(document.getElementById('text-boxw').value),letterSpacing:parseInt(document.getElementById('text-space').value),lineHeight:parseFloat(document.getElementById('text-lineh').value),z:layers.length});
  selectedId=id;renderLayers();renderLayerList();
}

function renderLayers(){
  const container=document.getElementById('canvas-items');container.innerHTML='';
  const sorted=[...layers].sort((a,b)=>a.z-b.z);
  sorted.forEach(layer=>{
    const el=document.createElement('div');el.className='item'+(layer.id===selectedId?' selected':'');el.dataset.id=layer.id;
    el.style.left=(layer.x*100)+'%';el.style.top=(layer.y*100)+'%';el.style.transform=`translate(-50%, -50%) rotate(${layer.rot}deg) scale(${layer.scale})`;el.style.zIndex=layer.z;
    if(layer.type==='text'){
      const tb=document.createElement('div');tb.className='text-box';tb.style.width=layer.boxW+'px';tb.style.fontSize=layer.fontSize+'px';tb.style.color=layer.color;tb.style.textAlign=layer.align;tb.style.letterSpacing=layer.letterSpacing+'px';tb.style.lineHeight=layer.lineHeight;tb.style.fontWeight='800';tb.textContent=layer.text;el.appendChild(tb);
    }else{
      const img=document.createElement('img');img.src=layer.src;img.style.width=layer.baseW+'px';img.style.height='auto';img.draggable=false;img.onerror=function(){this.src=makePlaceholder(layer.type.toUpperCase(),1,'#FFE4B5');};el.appendChild(img);
    }
    if(layer.id===selectedId){
      const del=document.createElement('div');del.className='handle del';del.textContent='x';del.onpointerdown=(e)=>{e.stopPropagation();deleteLayer(layer.id);};
      if(layer.type==='text'){
        const wl=document.createElement('div');wl.className='handle w-left';wl.textContent='寬';wl.title='拖拉縮減框寬';wl.onpointerdown=(e)=>startTextWidth(e,layer,'left');
        const wr=document.createElement('div');wr.className='handle w-right';wr.textContent='寬';wr.title='拖拉縮減框寬';wr.onpointerdown=(e)=>startTextWidth(e,layer,'right');
        const rot=document.createElement('div');rot.className='handle rot';rot.textContent='旋轉';rot.onpointerdown=(e)=>startRotate(e,layer);
        const up=document.createElement('div');up.className='handle up';up.textContent='上';up.onpointerdown=(e)=>{e.stopPropagation();moveLayer(layer.id,1);};
        const down=document.createElement('div');down.className='handle down';down.textContent='下';down.onpointerdown=(e)=>{e.stopPropagation();moveLayer(layer.id,-1);};
        el.appendChild(del);el.appendChild(wl);el.appendChild(wr);el.appendChild(rot);el.appendChild(up);el.appendChild(down);
      }else{
        const rot=document.createElement('div');rot.className='handle rot';rot.textContent='旋轉';rot.onpointerdown=(e)=>startRotate(e,layer);
        const sca=document.createElement('div');sca.className='handle scale';sca.textContent='縮放';sca.onpointerdown=(e)=>startScale(e,layer);
        const up=document.createElement('div');up.className='handle up';up.textContent='上';up.onpointerdown=(e)=>{e.stopPropagation();moveLayer(layer.id,1);};
        const down=document.createElement('div');down.className='handle down';down.textContent='下';down.onpointerdown=(e)=>{e.stopPropagation();moveLayer(layer.id,-1);};
        el.appendChild(del);el.appendChild(rot);el.appendChild(sca);el.appendChild(up);el.appendChild(down);
      }
    }
    el.onpointerdown=(e)=>startDrag(e,layer);
    container.appendChild(el);
  });
}
function renderLayerList(){
  const list=document.getElementById('layer-items');list.innerHTML='';
  const sorted=[...layers].sort((a,b)=>b.z-a.z);
  sorted.forEach(layer=>{
    const row=document.createElement('div');row.className='layer-item'+(layer.id===selectedId?' active':'');
    const name=layer.type==='text'?('文字: '+layer.text.slice(0,12)):(layer.type+' '+layer.id.slice(-3));
    row.innerHTML=`<span>${name}</span><span><button class="btn btn-small" data-act="up">上</button> <button class="btn btn-small" data-act="down">下</button> <button class="btn btn-small btn-danger" data-act="del">刪</button></span>`;
    row.onclick=()=>{selectedId=layer.id;renderLayers();renderLayerList();};
    row.querySelector('[data-act="up"]').onclick=(e)=>{e.stopPropagation();moveLayer(layer.id,1);};
    row.querySelector('[data-act="down"]').onclick=(e)=>{e.stopPropagation();moveLayer(layer.id,-1);};
    row.querySelector('[data-act="del"]').onclick=(e)=>{e.stopPropagation();deleteLayer(layer.id);};
    list.appendChild(row);
  });
}
function deleteLayer(id){layers=layers.filter(l=>l.id!==id);layers.forEach((l,i)=>l.z=i);if(selectedId===id)selectedId=null;renderLayers();renderLayerList();}
function moveLayer(id,dir){const idx=layers.findIndex(l=>l.id===id);if(idx<0)return;const newIdx=idx+dir;if(newIdx<0||newIdx>=layers.length)return;const tmp=layers[idx];layers[idx]=layers[newIdx];layers[newIdx]=tmp;layers.forEach((l,i)=>l.z=i);renderLayers();renderLayerList();}

let dragState=null;
function showShield(){document.getElementById('drag-shield').classList.add('show');document.body.classList.add('dragging');}
function hideShield(){document.getElementById('drag-shield').classList.remove('show');document.body.classList.remove('dragging');}

function startDrag(e,layer){
  if(e.target.classList.contains('handle'))return;
  e.preventDefault();e.stopPropagation();
  const rect=document.getElementById('canvas').getBoundingClientRect();
  const startX=e.clientX;const startY=e.clientY;const origX=layer.x;const origY=layer.y;
  if(selectedId!==layer.id){selectedId=layer.id;renderLayerList();document.querySelectorAll('.item').forEach(el=>el.classList.remove('selected'));const curEl=document.querySelector(`.item[data-id="${layer.id}"]`);if(curEl)curEl.classList.add('selected');}
  showShield();
  dragState={type:'drag',layer,startX,startY,origX,origY,rect};
  window.addEventListener('pointermove',onPointerMove,{passive:false});
  window.addEventListener('pointerup',onPointerUp);
}
function startTextWidth(e,layer,side){
  e.preventDefault();e.stopPropagation();showShield();
  dragState={type:'textW',layer,startX:e.clientX,origW:layer.boxW,side};
  window.addEventListener('pointermove',onPointerMove,{passive:false});
  window.addEventListener('pointerup',onPointerUp);
}
function startScale(e,layer){
  e.preventDefault();e.stopPropagation();showShield();
  const rect=document.getElementById('canvas').getBoundingClientRect();
  const centerX=rect.left+rect.width*layer.x;const centerY=rect.top+rect.height*layer.y;
  const startDist=Math.hypot(e.clientX-centerX,e.clientY-centerY);
  dragState={type:'scale',layer,startDist,origScale:layer.scale,centerX,centerY};
  window.addEventListener('pointermove',onPointerMove,{passive:false});
  window.addEventListener('pointerup',onPointerUp);
}
function startRotate(e,layer){
  e.preventDefault();e.stopPropagation();showShield();
  const rect=document.getElementById('canvas').getBoundingClientRect();
  const centerX=rect.left+rect.width*layer.x;const centerY=rect.top+rect.height*layer.y;
  const startAng=Math.atan2(e.clientY-centerY,e.clientX-centerX)*180/Math.PI;
  dragState={type:'rotate',layer,startAng,origRot:layer.rot,centerX,centerY};
  window.addEventListener('pointermove',onPointerMove,{passive:false});
  window.addEventListener('pointerup',onPointerUp);
}

function onPointerMove(e){
  if(!dragState)return;e.preventDefault();
  const {type,layer}=dragState;const canvas=document.getElementById('canvas');const rect=canvas.getBoundingClientRect();
  if(type==='drag'){
    const dx=(e.clientX-dragState.startX)/rect.width;const dy=(e.clientY-dragState.startY)/rect.height;
    let nx=dragState.origX+dx;let ny=dragState.origY+dy;
    const el=document.querySelector(`.item[data-id="${layer.id}"]`);
    if(el){
      const elW=el.offsetWidth*(layer.scale||1);const elH=el.offsetHeight*(layer.scale||1);
      const halfWPerc=(elW/2)/rect.width;const halfHPerc=(elH/2)/rect.height;
      const minX=halfWPerc+0.02;const maxX=1-halfWPerc-0.02;const minY=halfHPerc+0.02;const maxY=1-halfHPerc-0.02;
      nx=Math.min(maxX,Math.max(minX,nx));ny=Math.min(maxY,Math.max(minY,ny));
    }else{nx=Math.min(0.92,Math.max(0.08,nx));ny=Math.min(0.92,Math.max(0.08,ny));}
    layer.x=nx;layer.y=ny;
    const el2=document.querySelector(`.item[data-id="${layer.id}"]`);
    if(el2){el2.style.left=(nx*100)+'%';el2.style.top=(ny*100)+'%';}
  }else if(type==='scale'){
    const curDist=Math.hypot(e.clientX-dragState.centerX,e.clientY-dragState.centerY);
    let ns=dragState.origScale*(curDist/(dragState.startDist||1));ns=Math.min(3,Math.max(0.2,ns));
    layer.scale=ns;
    const el=document.querySelector(`.item[data-id="${layer.id}"]`);
    if(el)el.style.transform=`translate(-50%, -50%) rotate(${layer.rot}deg) scale(${ns})`;
  }else if(type==='rotate'){
    const curAng=Math.atan2(e.clientY-dragState.centerY,e.clientX-dragState.centerX)*180/Math.PI;
    layer.rot=dragState.origRot+(curAng-dragState.startAng);
    const el=document.querySelector(`.item[data-id="${layer.id}"]`);
    if(el)el.style.transform=`translate(-50%, -50%) rotate(${layer.rot}deg) scale(${layer.scale})`;
  }else if(type==='textW'){
    const delta=e.clientX-dragState.startX;const scale=layer.scale||1;
    let newW=dragState.origW+(dragState.side==='right'?delta/scale:-delta/scale);
    const maxWByCanvas=(rect.width*0.9)/scale;
    newW=Math.min(maxWByCanvas,600,Math.max(80,newW));
    layer.boxW=newW;
    const el=document.querySelector(`.item[data-id="${layer.id}"] .text-box`);
    if(el){el.style.width=newW+'px';el.style.wordBreak='break-word';el.style.overflowWrap='break-word';}
    const boxInput=document.getElementById('text-boxw');
    if(boxInput&&selectedId===layer.id){boxInput.value=Math.round(newW);document.getElementById('text-boxw-val').textContent=Math.round(newW);}
    const itemEl=document.querySelector(`.item[data-id="${layer.id}"]`);
    if(itemEl){const halfW=(newW*scale/2)/rect.width;if(layer.x+halfW>0.98)layer.x=0.98-halfW;if(layer.x-halfW<0.02)layer.x=0.02+halfW;itemEl.style.left=(layer.x*100)+'%';}
  }
}
function onPointerUp(e){
  hideShield();
  const moved=dragState?.layer;
  dragState=null;
  window.removeEventListener('pointermove',onPointerMove);
  window.removeEventListener('pointerup',onPointerUp);
  if(moved){renderLayers();renderLayerList();}
}

document.getElementById('canvas').addEventListener('pointerdown',(e)=>{
  if(e.target.id==='canvas'||e.target.id==='canvas-items'||e.target.id==='canvas-bg'||e.target.id==='drag-shield'){
    if(document.getElementById('drag-shield').classList.contains('show'))return;
    selectedId=null;renderLayers();renderLayerList();
  }
});

function setSize(size){currentSize=size;const canvas=document.getElementById('canvas');const btnPost=document.getElementById('btn-post');const btnStory=document.getElementById('btn-story');if(size==='post'){canvas.style.aspectRatio='1 / 1';btnPost.classList.add('active');btnStory.classList.remove('active');}else{canvas.style.aspectRatio='9 / 16';btnPost.classList.remove('active');btnStory.classList.add('active');}}
function handleUpload(input,type){
  const files=input.files;if(!files.length)return;if(files.length>10){alert('一次最多10張');return;}
  Array.from(files).forEach(file=>{const reader=new FileReader();reader.onload=(ev)=>{const dataUrl=ev.target.result;if(type==='dogs')customDogs.push(dataUrl);if(type==='acc')customAcc.push(dataUrl);if(type==='bg')customBg.push({color:'#ffffff',img:dataUrl,name:'自訂'});renderGrids();};reader.readAsDataURL(file);});
  input.value='';
}
async function exportCanvas(format){
  const scale=1.8;const w=1080*scale;const h=(currentSize==='post'?1080:1920)*scale;
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');
  ctx.fillStyle=currentBg.color||'#ffffff';ctx.fillRect(0,0,w,h);
  if(currentBg.img){try{const bgImg=await loadImage(currentBg.img);const imgRatio=bgImg.width/bgImg.height;const canvasRatio=w/h;let dw,dh,dx,dy;if(imgRatio>canvasRatio){dh=h;dw=h*imgRatio;dx=(w-dw)/2;dy=0;}else{dw=w;dh=w/imgRatio;dx=0;dy=(h-dh)/2;}ctx.drawImage(bgImg,dx,dy,dw,dh);}catch(e){}}
  const sorted=[...layers].sort((a,b)=>a.z-b.z);
  for(const layer of sorted){
    const cx=layer.x*w;const cy=layer.y*h;ctx.save();ctx.translate(cx,cy);ctx.rotate(layer.rot*Math.PI/180);ctx.scale(layer.scale,layer.scale);
    if(layer.type==='text'){
      ctx.fillStyle=layer.color;ctx.font=`800 ${layer.fontSize*scale}px sans-serif`;ctx.textAlign=layer.align;ctx.textBaseline='middle';
      const maxW=layer.boxW*scale;const lineH=layer.fontSize*scale*layer.lineHeight;
      const words=layer.text.split('\n');let lines=[];words.forEach(word=>{let line='';for(let ch of word){const test=line+ch;if(ctx.measureText(test).width>maxW&&line!==''){lines.push(line);line=ch;}else line=test;}lines.push(line);});
      const totalH=lines.length*lineH;let startY=-totalH/2+lineH/2;
      lines.forEach(line=>{let xOff=0;if(layer.align==='left')xOff=-maxW/2;if(layer.align==='right')xOff=maxW/2;if(layer.align==='left')ctx.textAlign='left';if(layer.align==='center')ctx.textAlign='center';if(layer.align==='right')ctx.textAlign='right';ctx.fillText(line,xOff,startY);startY+=lineH;});
    }else{try{const img=await loadImage(layer.src);const bw=layer.baseW*scale;const bh=bw*(img.height/img.width);ctx.drawImage(img,-bw/2,-bh/2,bw,bh);}catch(e){ctx.fillStyle='#FFE4B5';ctx.fillRect(-50*scale,-50*scale,100*scale,100*scale);}}
    ctx.restore();
  }
  const mime=format==='jpg'?'image/jpeg':'image/png';const url=canvas.toDataURL(mime,0.92);if(format==='preview')return url;const a=document.createElement('a');a.href=url;a.download=`christmas-card-${currentSize}.${format}`;a.click();
}
document.getElementById('btn-post').onclick=()=>setSize('post');
document.getElementById('btn-story').onclick=()=>setSize('story');
document.getElementById('btn-guide').onclick=()=>{const o=document.getElementById('guide-outer');const i=document.getElementById('guide-inner');const show=o.style.display==='none';o.style.display=show?'block':'none';i.style.display=show?'block':'none';};
document.querySelectorAll('.tab-btn').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');document.getElementById('panel-'+btn.dataset.tab).style.display='block';};});
document.getElementById('upload-dogs').onchange=function(){handleUpload(this,'dogs');};
document.getElementById('upload-acc').onchange=function(){handleUpload(this,'acc');};
document.getElementById('upload-bg').onchange=function(){handleUpload(this,'bg');};
document.getElementById('add-text').onclick=addTextLayer;
document.getElementById('text-size').oninput=function(){document.getElementById('text-size-val').textContent=this.value;};
document.getElementById('text-boxw').oninput=function(){document.getElementById('text-boxw-val').textContent=this.value;if(selectedId){const l=layers.find(x=>x.id===selectedId);if(l&&l.type==='text'){l.boxW=parseInt(this.value);const el=document.querySelector(`.item[data-id="${selectedId}"] .text-box`);if(el)el.style.width=l.boxW+'px';}}};
document.getElementById('text-space').oninput=function(){document.getElementById('text-space-val').textContent=this.value;};
document.getElementById('text-lineh').oninput=function(){document.getElementById('text-lineh-val').textContent=this.value;};
document.querySelectorAll('[data-align]').forEach(b=>{b.onclick=()=>{document.querySelectorAll('[data-align]').forEach(x=>x.classList.remove('active'));b.classList.add('active');};});
document.getElementById('btn-clear').onclick=()=>document.getElementById('modal-clear').classList.add('show');
document.getElementById('cancel-clear').onclick=()=>document.getElementById('modal-clear').classList.remove('show');
document.getElementById('confirm-clear').onclick=()=>{layers=[];selectedId=null;renderLayers();renderLayerList();document.getElementById('modal-clear').classList.remove('show');};
document.getElementById('btn-export').onclick=()=>{const fmt=document.getElementById('export-type').value;exportCanvas(fmt);};
document.getElementById('btn-preview').onclick=async()=>{const url=await exportCanvas('preview');document.getElementById('preview-img').src=url;document.getElementById('modal-preview').classList.add('show');};
document.getElementById('close-preview').onclick=()=>document.getElementById('modal-preview').classList.remove('show');
document.getElementById('modal-preview').onclick=(e)=>{if(e.target.id==='modal-preview')e.currentTarget.classList.remove('show');};
renderGrids();setBackground(currentBg);renderLayers();
</script>
